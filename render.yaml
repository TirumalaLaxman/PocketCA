services:
  - type: web
    name: pocketca
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GOOGLE_API_KEY
        sync: false  # Must be set manually in Render dashboard
